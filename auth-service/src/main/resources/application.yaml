spring:
  config:
    import: optional:file:../application.properties
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/auth_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8086

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}